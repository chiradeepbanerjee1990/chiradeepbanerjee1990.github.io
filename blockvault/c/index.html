<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#05060d">
  <!-- Static on purpose: GitHub Pages cannot vary these per link, and WhatsApp /
       Facebook read them without running JavaScript. -->
  <meta property="og:title" content="Can you beat my Block Vault score?">
  <meta property="og:description" content="Same board, same pieces. Tap to take the challenge - free neon block puzzle, works offline.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://chiradeepbanerjee1990.github.io/blockvault/assets/og-card.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://chiradeepbanerjee1990.github.io/blockvault/assets/og-card.png">
  <meta name="robots" content="noindex">
  <link rel="icon" href="../assets/icon-192.png">
  <title>Block Vault Challenge</title>
  <style>
    :root { --void:#05060d; --panel:#141a31; --line:#2a3358; --cyan:#00e5ff; --magenta:#ff2d95;
            --lime:#00ff9d; --amber:#ffc400; --text:#eaf0ff; --dim:#8d97c4; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
           background: radial-gradient(circle at 50% 0%, #1a1f45 0%, var(--void) 60%);
           color:var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding:24px 16px; }
    main { width:100%; max-width:420px; text-align:center; }
    .icon { width:96px; height:96px; border-radius:22px; box-shadow:0 0 40px rgba(0,229,255,.35); }
    h1 { font-size:14px; letter-spacing:.25em; color:var(--cyan); margin:18px 0 6px; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:22px; padding:22px 18px; margin:18px 0; }
    .who { color:var(--dim); font-size:14px; margin:0; }
    .score { font-size:52px; font-weight:900; margin:6px 0; letter-spacing:.02em; }
    .board { color:var(--amber); font-weight:800; letter-spacing:.12em; font-size:13px; margin:0; }
    .btn { display:block; width:100%; padding:17px; border-radius:16px; font-weight:800; font-size:17px;
           text-decoration:none; color:#05060d; background:linear-gradient(90deg,var(--lime),var(--cyan)); margin-top:12px; }
    .btn.ghost { background:none; color:var(--dim); border:1px solid var(--line); font-size:14px; padding:13px; }
    .note { color:var(--dim); font-size:12px; margin-top:16px; line-height:1.5; }
  </style>
</head>
<body>
<main>
  <img class="icon" src="../assets/icon-192.png" alt="Block Vault icon">
  <h1>BLOCK VAULT</h1>
  <div class="card" id="card">
    <p class="who" id="who">You've been challenged</p>
    <p class="score" id="score">Beat me</p>
    <p class="board" id="board">NEON BLOCK PUZZLE</p>
  </div>
  <a class="btn" id="play" href="https://play.google.com/store/apps/details?id=com.littlejoygames.blockvault">Take the challenge</a>
  <a class="btn ghost" id="store" href="https://play.google.com/store/apps/details?id=com.littlejoygames.blockvault">Get it on Google Play</a>
  <p class="note">Free on Android · 2,400 levels · plays offline.<br>Every player gets the exact same board, so it's a fair fight.</p>
</main>
<script>
(function () {
  var PKG = "com.littlejoygames.blockvault";
  var q = new URLSearchParams(location.search);
  var m = q.get("m"), s = parseInt(q.get("s"), 10), n = (q.get("n") || "").slice(0, 24);
  var isChallenge = (m === "l" || m === "d" || m === "e") && !isNaN(s);

  // Everything after "?" travels unchanged into the app, either through the App
  // Link below or through the Play install referrer (key "bvc").
  var query = location.search.replace(/^\?/, "");
  var ref = "utm_source=" + (isChallenge ? "challenge" : (q.get("src") || "share")) +
            "&utm_medium=share_link" + (isChallenge ? "&bvc=" + encodeURIComponent(query) : "");
  var playUrl = "https://play.google.com/store/apps/details?id=" + PKG + "&referrer=" + encodeURIComponent(ref);

  var fmt = function (x) { return x.toLocaleString("en-US"); };
  var text = function (id, v) { document.getElementById(id).textContent = v; };
  if (isChallenge) {
    text("who", (n || "Your friend") + " scored");
    text("score", fmt(s));
    if (m === "l") text("board", "ON LEVEL " + fmt(parseInt(q.get("l"), 10) || 1));
    if (m === "e") text("board", "IN ENDLESS MODE");
    if (m === "d") {
      var d = parseInt(q.get("d"), 10);
      var today = Math.floor(Date.now() / 86400000);
      text("board", d === today ? "ON TODAY'S DAILY CHALLENGE" : "ON A PAST DAILY CHALLENGE");
    }
    document.title = (n || "A friend") + " challenged you on Block Vault";
  } else {
    text("who", "Your friend is playing");
    text("score", "Block Vault");
    document.getElementById("play").textContent = "Play free";
  }

  document.getElementById("store").href = playUrl;
  var play = document.getElementById("play");
  if (/Android/i.test(navigator.userAgent)) {
    // Opens the game if installed; Chrome falls back to Play (with the
    // challenge in the referrer) if it is not. Works even before App Link
    // verification succeeds, because the package is named explicitly.
    play.href = "intent://" + location.host + location.pathname + location.search +
      "#Intent;scheme=https;package=" + PKG +
      ";S.browser_fallback_url=" + encodeURIComponent(playUrl) + ";end";
  } else {
    play.href = playUrl;
  }
})();
</script>
</body>
</html>
